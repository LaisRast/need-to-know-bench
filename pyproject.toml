[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "need-to-know-bench"
version = "0.2.0"
description = "Does your AI assistant know what not to say?"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Laith Rastanawi" }]
requires-python = ">=3.13"
dependencies = [
    "inspect-ai>=0.3.237",
    "markdown>=3.7",
    "openai>=2.41.0",
]

[tool.ntk]
headline = "NeedToKnow-Bench"
summary = """
A benchmark measuring whether LLM assistants reveal sensitive values while helping with legitimate
tasks that draw on privileged context. Each scenario pairs retrieved context containing sensitive
values with a realistic task that creates natural pressure to reveal one. Each reply is discreet,
refused, or leaked, and models are ranked by how often their replies are discreet.
"""

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
